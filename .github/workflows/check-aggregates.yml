# 手動觸發：檢查（並可修復）所有群組的彙總欄位（餘額、支出與收入總額與筆數、每人參與筆數），見 docs/guides/operations.md。
# 到 GitHub 的 Actions 頁面選「Check group aggregates」→ Run workflow。
# 預設只列出哪些群組對不上、差在哪（dry-run）；勾選 apply 才會寫回重算的值。可重複執行。
name: Check group aggregates

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '勾選才會寫回重算的值（不勾選＝dry-run，只列出差異）'
        type: boolean
        default: false
      group:
        description: '只處理這個群組 id（留空＝全部群組）'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    # 只允許在 main 上執行，避免從未合併的分支對正式資料庫寫入
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATSPLIT_APP }}
      - name: Run check
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          APPLY: ${{ inputs.apply }}
          GROUP: ${{ inputs.group }}
        run: |
          set +e
          ARGS="--project catsplit-app"
          if [ -n "$GROUP" ]; then ARGS="$ARGS --group $GROUP"; fi
          if [ "$APPLY" = "true" ]; then
            echo '### 群組彙總（實際寫回）' >> "$GITHUB_STEP_SUMMARY"
            ARGS="$ARGS --apply"
          else
            echo '### 群組彙總（dry-run，沒有寫入）' >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/check-aggregates.mjs $ARGS 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # 結束碼 2 只代表「有差異」或「有群組被跳過」，不是工具壞掉；其他非零才讓工作失敗
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
