# 手動觸發：把舊 LINE 使用者（uid 就是 LINE userId）的資料轉成新的內部 uid（u_ 開頭），見 docs/operations.md「舊 LINE uid 轉成內部 uid」。
# 到 GitHub 的 Actions 頁面選「Migrate legacy uids」→ Run workflow。
# 預設只列出每位使用者會搬什麼（dry-run）；勾選 apply 才會真的轉。可重複執行，已轉完的會略過，中斷後重跑會從中斷處繼續。
name: Migrate legacy uids

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '勾選才會真的轉移（不勾選＝dry-run，只列出）'
        type: boolean
        default: false
      uid:
        description: '只轉這一位（LINE userId，U 開頭；留空＝全部）'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  migrate:
    # 只允許在 main 上執行，避免從未合併的分支對正式資料庫寫入
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATSPLIT_APP }}
      - name: Run migration
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          APPLY: ${{ inputs.apply }}
          ONLY_UID: ${{ inputs.uid }}
        run: |
          ARGS="--project catsplit-app"
          if [ -n "$ONLY_UID" ]; then ARGS="$ARGS --uid $ONLY_UID"; fi
          if [ "$APPLY" = "true" ]; then
            echo '### 舊 LINE uid 轉移（實際執行）' >> "$GITHUB_STEP_SUMMARY"
            ARGS="$ARGS --apply"
          else
            echo '### 舊 LINE uid 轉移（dry-run，沒有寫入）' >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/migrate-legacy-uids.mjs $ARGS 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
