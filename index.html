<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>貓咪分帳 CatSplit</title>
    <!-- 分享連結 /s/:id（含 LIFF 帶回來的 liff.state）在 App 載入前換回 /group/:id -->
    <script>(function(){var l=location,p=l.pathname,u=new URLSearchParams(l.search),s=u.get('liff.state'),c=0;if(s&&s.indexOf('/s/')===0){u.set('liff.state','/group/'+s.slice(3));c=1}if(p.indexOf('/s/')===0){p='/group/'+p.slice(3);c=1}if(c){var q=u.toString();history.replaceState(null,'',p+(q?'?'+q:'')+l.hash)}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
